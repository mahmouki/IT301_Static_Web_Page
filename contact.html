<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Walking Harrisonburg</title>
  <!-- Google Fonts: Young Serif (headings) and Libre Franklin (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;700&amp;family=Young+Serif&amp;display=swap">
  <!-- Shared styles, then this page's own stylesheet -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/contact.css">
</head>
<body>
  <!-- Site header and navigation (same on every page) -->
  <header class="site-header">
    <p class="logo">Walking Harrisonburg</p>
    <nav class="site-nav" aria-label="Main">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="walks.html">Walks</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Contact me</h1>
    <p>Suggest a place to photograph or ask about a photo. All fields are required.</p>
    <!-- Form with built-in HTML validation (required, type=email, minlength) -->
    <form class="contact-form" method="post">
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" required minlength="2" autocomplete="name">

      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required autocomplete="email">

      <label for="topic">Topic</label>
      <select id="topic" name="topic" required>
        <option value="">Choose a topic</option>
        <option value="place">Suggest a place</option>
        <option value="photo">Question about a photo</option>
        <option value="other">Something else</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required minlength="10"></textarea>

      <button class="btn" type="submit">Send message</button>
    </form>
  </main>
  <!-- Footer (same on every page) -->
  <footer class="site-footer">
    <p>&copy; 2026 Walking Harrisonburg. Photos taken on foot in Harrisonburg, Virginia.</p>
    <p><a href="https://www.visitharrisonburgva.com/">Visit Harrisonburg</a></p>
  </footer>
</body>
</html>
